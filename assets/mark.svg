<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Ancient">
  <title>Ancient</title>
  <!-- Entablature: what the column carries. -->
  <rect x="2.6" y="3.2" width="18.8" height="2.4" fill="#E7E1D4"/>
  <!-- Three flutes: the column itself. -->
  <rect x="5.6" y="7.4" width="2.4" height="13.4" fill="#E7E1D4"/>
  <rect x="10.8" y="7.4" width="2.4" height="13.4" fill="#E7E1D4"/>
  <rect x="16" y="7.4" width="2.4" height="13.4" fill="#E7E1D4"/>
  <!-- The tie bar: scaffolding, and the only gold in the mark. It reaches past
       the column on both sides, because maintenance is added, not built in. -->
  <rect x="3.4" y="12.6" width="17.2" height="1.8" fill="#E0A45C"/>
</svg>
